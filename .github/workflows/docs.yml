name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # The interface is the source of truth. Exporting it here catches a
      # public signature that changed without its .mbti being regenerated.
      - name: interfaces are current
        run: |
          moon info --target all && git diff --exit-code

      # The static API page is derived, never hand-edited. `--check` refuses a
      # page that no longer matches the interfaces and the source comments.
      - name: api reference is current
        run: python3 scripts/docs/gen_api.py --check

      # The pages run the library itself: this compiles it to JavaScript and
      # puts it in `docs/engine/`, which is in .gitignore. The artefact is
      # built here rather than committed, so a page cannot show a stale engine.
      - name: build the browser engine
        run: python3 scripts/build_site.py engine

      # The tray is TypeScript compiled to a committed script, so the site can
      # be served without a Node step. Its toolchain is installed only to hold
      # that script to its source and to the matter-js version it pins.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: install the site tools
        run: npm ci --prefix site

      # The counts on the homepage are read from the source; the committed copy
      # is compared so a page cannot drift from the code it describes. The same
      # step recompiles the tray and compares the vendored library.
      - name: site numbers, tray and vendor are current
        run: python3 scripts/build_site.py --check

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
