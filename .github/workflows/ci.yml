name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master
  # Twice a month, so a new toolchain or a dependency's release shows up while nothing is pushed.
  schedule:
    - cron: "43 1 1,16 * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the api page matches the interfaces
        run: python3 scripts/docs/gen_api.py --check

      - name: the embedded corpus matches the corpus files
        run: python3 scripts/difftest/embed_corpus.py --check

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # Differential tests. The fixtures are produced offline by the reference
  # libraries; CI only verifies their internal consistency and that the
  # in-source corpus fixtures are current, so no third-party MoonBit module is
  # ever resolved and no reference toolchain is needed to run the MoonBit suite.
  # The MoonBit replay of the corpus itself runs in the build job's
  # `moon test --target all` (src/corpus_test.mbt).
  difftest:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: fixtures are internally consistent
        run: python3 scripts/difftest/verify_fixtures.py

      - name: the corpus matches its manifest
        run: python3 scripts/difftest/make_corpus.py --check

      - name: the embedded corpus is current
        run: python3 scripts/difftest/embed_corpus.py --check

      # The format fixtures are generated offline too: fontTools and FreeType
      # produce the expected outlines and ink, and the MoonBit test replays
      # them. Regenerating needs both libraries, so CI only proves the fonts on
      # disk are the ones the test carries.
      - name: the format fixtures are current
        run: python3 scripts/difftest/make_formats.py --check
